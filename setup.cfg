[metadata]
name = everydai
version = 0.9
author = Rokas Zemaitis
author_email = rokas.zemaitis2@gmail.com
description = A tool to manage and prepare Everyday project pictures for a movie
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/rzemaitis/everyd.ai
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
license_files = LICENSE.txt

[options]
package_dir=
    =src
packages=find:

[options.packages.find]
where=src
